<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><title>Switchboard bold logos</title>
<style>
body{margin:0;background:#0d0f12;color:#e8e8e8;font:15px system-ui,sans-serif}
h1{text-align:center;font-weight:600;margin:32px 16px 6px}
p.lead{text-align:center;color:#8b929c;margin:0 16px 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;max-width:1300px;margin:0 auto;padding:0 16px 48px}
.card{background:#171a1f;border:1px solid #252a31;border-radius:18px;padding:22px;text-align:center}
.big{width:150px;height:150px;filter:drop-shadow(0 10px 24px #0008)}
.row{display:flex;justify-content:center;gap:14px;align-items:center;margin-top:14px}
.row .m{width:32px;height:32px}.row .s{width:16px;height:16px}
.light{background:#f3f3f3;border-radius:8px;padding:6px 8px;display:flex;gap:10px;align-items:center}
b{display:block;margin-top:14px;font-size:17px}span{color:#8b929c;font-size:13px}
</style></head><body>
<h1>Switchboard — 10 odważnych logo</h1>
<p class="lead">150 px · 32 px · 16 px (ciemne i jasne tło)</p>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="bgDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#23272e"/><stop offset="1" stop-color="#0b0c0f"/></linearGradient>
<linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb07a"/><stop offset="1" stop-color="#ff5a5f"/></linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
<linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#5b21b6"/></linearGradient>
<linearGradient id="navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e2a5a"/><stop offset="1" stop-color="#0a0f2a"/></linearGradient>
<radialGradient id="metal" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#f2f2f2"/><stop offset=".6" stop-color="#9aa0a8"/><stop offset="1" stop-color="#4a4f57"/></radialGradient>
<linearGradient id="holo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset=".35" stop-color="#c4b5fd"/><stop offset=".7" stop-color="#f9a8d4"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

<symbol id="i1" viewBox="0 0 128 128"><rect width="128" height="128" rx="30" fill="#050507"/>
<path d="M84 30 C 50 22, 34 48, 58 60 C 82 72, 74 102, 40 96" stroke="url(#neon)" stroke-width="9" fill="none" stroke-linecap="round" filter="url(#glow)"/>
<rect x="76" y="20" width="24" height="18" rx="5" fill="#d9d9de" transform="rotate(12 88 29)"/><rect x="96" y="25" width="12" height="6" rx="3" fill="#9aa0a8" transform="rotate(12 88 29)"/>
<circle cx="38" cy="96" r="7" fill="#ff2bd6" filter="url(#glow)"/></symbol>

<symbol id="i2" viewBox="0 0 128 128"><rect width="128" height="128" rx="30" fill="url(#bgDark)"/>
<path d="M22 64 A 42 14 0 0 0 106 64" stroke="#ffffff22" stroke-width="3" fill="none"/>
<ellipse cx="64" cy="64" rx="22" ry="40" fill="url(#violet)"/><path d="M64 24 A 22 40 0 0 1 64 104 A 10 40 0 0 0 64 24" fill="#3b1585"/>
<ellipse cx="58" cy="64" rx="20" ry="40" fill="url(#coral)"/>
<circle cx="58" cy="54" r="7" fill="#fff"/><path d="M46 80 Q58 64 70 80" fill="#fff"/></symbol>

<symbol id="i3" viewBox="0 0 128 128"><rect width="128" height="128" rx="30" fill="url(#bgDark)"/>
<path d="M38 20 H90 M38 108 H90" stroke="#cfd3da" stroke-width="7" stroke-linecap="round"/>
<path d="M42 24 Q42 56 64 64 Q86 56 86 24 Z" fill="#ffffff14" stroke="#cfd3da" stroke-width="3"/><path d="M42 104 Q42 72 64 64 Q86 72 86 104 Z" fill="#ffffff14" stroke="#cfd3da" stroke-width="3"/>
<rect x="56" y="30" width="16" height="8" rx="2" fill="#ff7a59"/>
<rect x="60" y="56" width="8" height="5" rx="1.5" fill="#ffb07a" filter="url(#glow)"/>
<rect x="50" y="94" width="28" height="7" rx="2" fill="#34d399"/><rect x="52" y="84" width="24" height="7" rx="2" fill="#34d399"/><rect x="55" y="74" width="18" height="7" rx="2" fill="#34d399" opacity=".7"/></symbol>

<symbol id="i4" viewBox="0 0 128 128"><rect width="128" height="128" rx="30" fill="url(#navy)"/>
<path d="M72 14 L40 66 H62 L54 86" stroke="#fff" stroke-width="0" fill="none"/>
<polygon points="74,12 38,68 60,68 50,96 66,74 50,74" fill="#fff"/>
<polygon points="50,96 30,118 46,102" fill="url(#coral)" filter="url(#glow)"/>
<polygon points="50,96 82,116 62,100" fill="url(#violet)" filter="url(#glow)"/>
<polygon points="66,74 92,58 74,78" fill="#ffb07a"/></symbol>

<symbol id="i5" viewBox="0 0 128 128"><rect width="128" height="128" rx="30" fill="#111316"/>
<g stroke-width="5" stroke-linecap="round">
<path d="M34 94 L28 100" stroke="#5b6270"/><path d="M26 66 L18 66" stroke="#5b6270"/><path d="M34 38 L28 32" stroke="#5b6270"/><path d="M64 26 L64 18" stroke="#5b6270"/><path d="M94 38 L100 32" stroke="#ffb07a"/><path d="M102 66 L110 66" stroke="#ff5a5f" filter="url(#glow)"/><path d="M94 94 L100 100" stroke="#ff2a2a" filter="url(#glow)"/></g>
<circle cx="64" cy="66" r="32" fill="url(#metal)"/><circle cx="64" cy="66" r="24" fill="none" stroke="#ffffff55" stroke-width="1.5"/>
<line x1="64" y1="66" x2="88" y2="48" stroke="#ff5a5f" stroke-width="6" stroke-linecap="round"/></symbol>

<symbol id="i6" viewBox="0 0 128 128"><rect width="128" height="128" rx="30" fill="#2a1052"/>
<path d="M24 24 H104 V104 H24 Z" fill="url(#violet)"/>
<path d="M104 24 V104 H24 Z" fill="#4c1d95"/>
<path d="M104 24 L24 104 L60 58 Z" fill="url(#coral)"/>
<path d="M104 24 L60 58 L24 104" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/></symbol>

<symbol id="i7" viewBox="0 0 128 128"><rect width="128" height="128" rx="30" fill="#1a1c20"/>
<g stroke="#4a4f57" stroke-width="4"><path d="M54 118 V70 Q54 40 30 14"/><path d="M74 118 V70 Q74 40 50 14"/></g>
<g stroke="#5b6270" stroke-width="3"><path d="M50 108 H78 M50 94 H78 M50 80 H78"/></g>
<path d="M54 118 V70 Q54 40 78 14 M74 118 V70 Q74 40 98 14" stroke="url(#coral)" stroke-width="6" fill="none" filter="url(#glow)"/></symbol>

<symbol id="i8" viewBox="0 0 128 128"><rect width="128" height="128" rx="30" fill="#0d1240"/>
<path d="M64 64 L104 44 A 44 44 0 1 0 104 84 Z" fill="url(#coral)"/>
<circle cx="66" cy="40" r="6" fill="#0d1240"/>
<path d="M64 64 L106 50 A 44 44 0 0 1 106 78 Z" fill="#ffd166" transform="translate(16 0)"/>
<circle cx="112" cy="64" r="0"/></symbol>

<symbol id="i9" viewBox="0 0 128 128"><rect width="128" height="128" rx="30" fill="#050507"/>
<g transform="rotate(-14 64 70)"><rect x="24" y="40" width="70" height="46" rx="9" fill="url(#holo)" opacity=".45"/></g>
<g transform="rotate(8 64 70)"><rect x="34" y="46" width="70" height="46" rx="9" fill="url(#holo)" opacity=".9"/>
<rect x="44" y="58" width="14" height="10" rx="2" fill="#ffffffaa"/><rect x="44" y="76" width="36" height="4" rx="2" fill="#ffffff88"/></g></symbol>

<symbol id="i10" viewBox="0 0 128 128"><rect width="128" height="128" rx="30" fill="#000"/>
<circle cx="64" cy="64" r="48" fill="none" stroke="#2dd4bf" stroke-width="5" opacity=".55" transform="translate(-3 3)"/>
<circle cx="64" cy="64" r="34" fill="none" stroke="#a78bfa" stroke-width="6" opacity=".8" transform="translate(2 -2)"/>
<circle cx="64" cy="64" r="20" fill="none" stroke="#ff7a59" stroke-width="7" filter="url(#glow)"/>
<circle cx="64" cy="64" r="8" fill="#fff"/></symbol>
</defs></svg>

<div class="grid" id="g"></div>
<script>
const items=[
['1 · Neonowa wtyczka','Kabel-neon układa się w S.'],
['2 · Moneta w locie','Dwie strony = dwa konta.'],
['3 · Klepsydra-bateria','Limit, który się przesypuje.'],
['4 · Rozwidlona błyskawica','Moc rozdzielona na konta.'],
['5 · Studyjne pokrętło','Wskaźnik tuż przed czerwoną strefą.'],
['6 · Origami','Kartka przełożona na drugą stronę.'],
['7 · Zwrotnica','Dosłowny „switch”: aktywny tor świeci.'],
['8 · Pac-Man limitu','Wykres zjada resztę limitu.'],
['9 · Holograficzne karty','Konta jak karty premium.'],
['10 · Pulsar','Każdy pierścień to konto.']];
const u=(i,c)=>`<svg class="${c}" viewBox="0 0 128 128"><use href="#i${i}"/></svg>`;
document.getElementById('g').innerHTML=items.map(([t,d],k)=>{const i=k+1;return `<div class="card">${u(i,'big')}<div class="row">${u(i,'m')}${u(i,'s')}<div class="light">${u(i,'m')}${u(i,'s')}</div></div><b>${t}</b><span>${d}</span></div>`}).join('');
</script>
</body></html>
